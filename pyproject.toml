[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtitle-telegram-bot"
version = "0.1.0"
description = "Telegram bot for finding and downloading subtitles from approved providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4.0",
    "aiohttp>=3.14,<3.15",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "redis>=6.0,<9.0",
    "structlog>=25.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.400,<2.0",
    "pyyaml>=6.0,<7.0",
    "pytest>=8.4,<9.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
